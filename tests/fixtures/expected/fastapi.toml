[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
name = "fastapi"
dynamic = ["version"]
description = "FastAPI framework, high performance, easy to learn, fast to code, ready for production"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Sebastián Ramírez", email = "tiangolo@gmail.com" },
]
classifiers = [
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development",
    "Typing :: Typed",
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "starlette>=99.0.0",
    "pydantic>=99.0.0",
    "typing-extensions>=99.0.0",
    "typing-inspection>=99.0.0",
    "annotated-doc>=99.0.0",
    "opentelemetry-api>=99.0.0",
]

[project.urls]
Homepage = "https://github.com/fastapi/fastapi"
Documentation = "https://fastapi.tiangolo.com/"
Repository = "https://github.com/fastapi/fastapi"
Issues = "https://github.com/fastapi/fastapi/issues"
Changelog = "https://fastapi.tiangolo.com/release-notes/"

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-sdk>=99.0.0",
    "opentelemetry-exporter-otlp-proto-http>=99.0.0",
]
standard = [
    "opentelemetry-sdk>=99.0.0",
    "opentelemetry-exporter-otlp-proto-http>=99.0.0",
    "fastapi-cli[standard] >=99.0.0",
    "fastar >= 99.0.0",
    # For the test client
    "httpx >=0.99.99,<1.0.0",
    "httpx2 >=99.0.0",
    # For templates
    "jinja2 >=99.0.0",
    # For forms and file uploads
    "python-multipart >=99.0.0",
    # To validate email fields
    "email-validator >=99.0.0",
    # Uvicorn with uvloop
    "uvicorn[standard] >=99.0.0",
    # # Settings management
    "pydantic-settings >=99.0.0",
    # # Extra Pydantic data types
    "pydantic-extra-types >=99.0.0",
]

standard-no-fastapi-cloud-cli = [
    "opentelemetry-sdk>=99.0.0",
    "opentelemetry-exporter-otlp-proto-http>=99.0.0",
    "fastapi-cli[standard-no-fastapi-cloud-cli] >=99.0.0",
    # For the test client
    "httpx >=0.99.99,<1.0.0",
    "httpx2 >=99.0.0",
    # For templates
    "jinja2 >=99.0.0",
    # For forms and file uploads
    "python-multipart >=99.0.0",
    # To validate email fields
    "email-validator >=99.0.0",
    # Uvicorn with uvloop
    "uvicorn[standard] >=99.0.0",
    # # Settings management
    "pydantic-settings >=99.0.0",
    # # Extra Pydantic data types
    "pydantic-extra-types >=99.0.0",
]

all = [
    "opentelemetry-sdk>=99.0.0",
    "opentelemetry-exporter-otlp-proto-http>=99.0.0",
    "fastapi-cli[standard] >=99.0.0",
    # # For the test client
    "httpx >=0.99.99,<1.0.0",
    "httpx2 >=99.0.0",
    # For templates
    "jinja2 >=99.0.0",
    # For forms and file uploads
    "python-multipart >=99.0.0",
    # For Starlette's SessionMiddleware, not commonly used with FastAPI
    "itsdangerous >=99.0.0",
    # For Starlette's schema generation, would not be used with FastAPI
    "pyyaml >=99.0.0",
    # To validate email fields
    "email-validator >=99.0.0",
    # Uvicorn with uvloop
    "uvicorn[standard] >=99.0.0",
    # Settings management
    "pydantic-settings >=99.0.0",
    # Extra Pydantic data types
    "pydantic-extra-types >=99.0.0",
]

[project.scripts]
fastapi = "fastapi.cli:main"

[dependency-groups]
dev = [
    { include-group = "tests" },
    { include-group = "docs" },
    { include-group = "translations" },
    "playwright >=99.0.0",
    "prek >=99.0.0",
    "zizmor >=99.0.0",
]
docs = [
    { include-group = "docs-tests" },
    "black >=99.0.0",
    "cairosvg >=99.0.0",
    "griffe-typingdoc >=99.0.0",
    "griffe-warnings-deprecated >=99.0.0",
    "jieba >=99.0.0",
    "markdown-include-variants >=99.0.0",
    "mdx-include >=1.99.99,<2.0.0",
    "mkdocstrings[python] >=99.0.0",
    "pillow >=99.0.0",
    "python-slugify >=99.0.0",
    "pyyaml >=6.99.99,<7.0.0",
    "typer >=99.0.0",
    "zensical >=99.0.0",
]
docs-tests = [
    "httpx >=0.99.99,<1.0.0",
    "httpx2>=99.0.0",
    "ruff>=0.14.14,<0.17.0",
]
github-actions = [
    "httpx >=0.99.99,<1.0.0",
    "pydantic >=2.99.99,<3.0.0",
    "pydantic-settings >=2.99.99,<3.0.0",
    "pygithub >=2.99.99,<3.0.0",
    "pyyaml >=6.99.99,<7.0.0",
    "smokeshow >=99.0.0",
]
tests = [
    "opentelemetry-instrumentation-fastapi>=99.0.0",
    "logfire>=99.0.0",
    "sentry-sdk>=99.0.0",
    "opentelemetry-sdk>=99.0.0",
    "opentelemetry-exporter-otlp-proto-http>=99.0.0",

    { include-group = "docs-tests" },
    "anyio[trio] >=4.99.99,<5.0.0",
    "coverage[toml] >=7.99.99,<8.0",
    "dirty-equals >=99.0.0",
    "flask >=3.99.99,<4.0.0",
    "inline-snapshot >=99.0.0",
    "mypy >=99.0.0",
    "pwdlib[argon2] >=99.0.0",
    "pyjwt >=99.0.0",
    "pytest >=99.0.0",
    "pytest-codspeed >=99.0.0",
    "pyyaml >=6.99.99,<7.0.0",
    "sqlmodel >=99.0.0",
    "strawberry-graphql >=0.200.0,<1.0.0",
    "ty>=99.0.0",
    "typer >=99.0.0",
    "a2wsgi >=2.0.0,<=2.0.0",
    "pytest-xdist[psutil]>=99.0.0",
    "pytest-cov>=99.0.0",
    "pytest-sugar>=99.0.0",
    "pytest-timeout>=99.0.0",
]
translations = [
    "gitpython >=99.0.0",
    "pydantic-ai >=99.0.0",
    "pygithub >=99.0.0",
]

[tool.pdm]
version = { source = "file", path = "fastapi/__init__.py" }
distribution = true

[tool.pdm.build]
source-includes = [
    "tests/",
    "docs_src/",
    "scripts/",
    # For a test
    "docs/en/docs/img/favicon.png",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
strict = true

[[tool.mypy.overrides]]
module = "fastapi.concurrency"
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.tests.*"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "docs_src.*"
disallow_incomplete_defs = false
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest]
minversion = "9.0"
addopts = [
  "--strict-config",
  "--strict-markers",
  "--ignore=docs_src",
]
strict_xfail = true
filterwarnings = [
    "error",
]
timeout = "20"

[tool.coverage.run]
patch = ["subprocess", "_exit"]
parallel = true
data_file = "coverage/.coverage"
source = [
    "docs_src",
    "tests",
    "fastapi"
]
relative_files = true
context = '${CONTEXT}'
omit = [
    "tests/benchmarks/*",
    "tests/memory_benchmarks/*",
    "docs_src/response_model/tutorial003_04_py310.py",
    "docs_src/dependencies/tutorial013_an_py310.py",  # temporary code example?
    "docs_src/dependencies/tutorial014_an_py310.py",  # temporary code example?
    # Pydantic v1 migration, no longer tested
    "docs_src/pydantic_v1_in_v2/tutorial001_an_py310.py",
    "docs_src/pydantic_v1_in_v2/tutorial002_an_py310.py",
    "docs_src/pydantic_v1_in_v2/tutorial003_an_py310.py",
    "docs_src/pydantic_v1_in_v2/tutorial004_an_py310.py",
]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.coverage.html]
show_contexts = true

[tool.ruff]
# Translation fixtures intentionally contain malformed code and comments.
extend-exclude = ["scripts/tests/test_translation_fixer/**/*.md"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"docs_src/custom_request_and_route/tutorial002_an_py310.py" = ["B904"]
"docs_src/custom_request_and_route/tutorial002_py310.py" = ["B904"]
"docs_src/custom_response/tutorial007_py310.py" = ["B007"]
"docs_src/dependencies/tutorial007_py310.py" = ["F821"]
"docs_src/dependencies/tutorial008_an_py310.py" = ["F821"]
"docs_src/dependencies/tutorial008_py310.py" = ["F821"]
"docs_src/dependencies/tutorial008b_an_py310.py" = ["B904"]
"docs_src/dependencies/tutorial008b_py310.py" = ["B904"]
"docs_src/dependencies/tutorial010_py310.py" = ["F821"]
"docs_src/path_operation_advanced_configuration/tutorial007_py310.py" = ["B904"]
"docs_src/query_params_str_validations/tutorial012_an_py310.py" = ["B006"]
"docs_src/query_params_str_validations/tutorial013_an_py310.py" = ["B006"]
"docs_src/security/tutorial004_an_py310.py" = ["B904"]
"docs_src/security/tutorial004_py310.py" = ["B904"]
"docs_src/security/tutorial005_an_py310.py" = ["B904"]
"docs_src/security/tutorial005_py310.py" = ["B904"]
"docs_src/json_base64_bytes/tutorial001_py310.py" = ["UP012"]
"docs_src/stream_json_lines/tutorial001_py310.py" = ["UP028"]
"docs_src/stream_data/tutorial001_py310.py" = ["UP028"]
"docs_src/stream_data/tutorial002_py310.py" = ["UP028"]
"docs_src/server_sent_events/tutorial001_py310.py" = ["UP028"]

[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "starlette"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.inline-snapshot]
# default-flags=["fix"]
# default-flags=["create"]

[tool.typos.files]
extend-exclude = [
    "coverage/",
    "dist/",
    "docs/de/",
    "docs/en/data/",
    "docs/en/docs/img/",
    "docs/es/",
    "docs/fr/",
    "docs/ja/",
    "docs/ko/",
    "docs/language_names.yml",
    "docs/pt/",
    "docs/ru/",
    "docs/tr/",
    "docs/uk/",
    "docs/zh/",
    "docs/zh-hant/",
    "docs/hi/",
    "htmlcov/",
    "scripts/general-llm-prompt.md",
    "scripts/tests/test_translation_fixer/test_complex_doc/",
    "site/",
    "site_build/",
    "uv.lock",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Quoted typo documented in a release note
    "'wll' to 'will'",
    # German article title in a release note
    "FastAPI Modul.",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.typos.default.extend-words]
ba = "ba"
certifi = "certifi"
fo = "fo"
havin = "havin"
Ines = "Ines"
ser = "ser"

[tool.ty.src]
exclude = [
    # These docs examples are intentionally partial, dynamic, environment-driven,
    # deprecated, or currently require broader tutorial rewrites to satisfy ty.
    "docs_src/additional_status_codes/",
    "docs_src/app_testing/tutorial003_py310.py",
    "docs_src/body_multiple_params/",
    "docs_src/body_updates/tutorial002_py310.py",
    "docs_src/custom_docs_ui/",
    "docs_src/custom_response/tutorial001_py310.py",
    "docs_src/custom_response/tutorial001b_py310.py",
    "docs_src/custom_response/tutorial009c_py310.py",
    "docs_src/dependencies/tutorial007_py310.py",
    "docs_src/dependencies/tutorial008_an_py310.py",
    "docs_src/dependencies/tutorial008_py310.py",
    "docs_src/dependencies/tutorial010_py310.py",
    "docs_src/events/",
    "docs_src/extending_openapi/tutorial001_py310.py",
    "docs_src/path_params_numeric_validations/",
    "docs_src/pydantic_v1_in_v2/tutorial004_an_py310.py",
    "docs_src/python_types/tutorial003_py310.py",
    "docs_src/python_types/tutorial011_py310.py",
    "docs_src/query_params_str_validations/",
    "docs_src/response_model/tutorial006_py310.py",
    "docs_src/security/tutorial003_an_py310.py",
    "docs_src/security/tutorial003_py310.py",
    "docs_src/security/tutorial004_an_py310.py",
    "docs_src/security/tutorial004_py310.py",
    "docs_src/security/tutorial005_an_py310.py",
    "docs_src/security/tutorial005_py310.py",
    "docs_src/settings/",
    "docs_src/sql_databases/",
    "docs_src/using_request_directly/tutorial001_py310.py",
    "docs_src/wsgi/tutorial001_py310.py",
]

[tool.ty.terminal]
error-on-warning = true
